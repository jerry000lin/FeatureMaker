[project]
name = "featuremaker-api"
version = "0.1.0"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard]",
    "uvicorn",
    "pydantic-settings",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[tool.poetry]
package-mode = false

[tool.fastapi]
entrypoint = "featuremaker.main:app"
